# VOT toolkit tracker registry used for the official VOTS2026 runs.
# NOTE: `paths` and `python` must be absolute — adjust them to your local clone.

[dam4sam_b]
label = DAM4SAM (SAM2.1-B+)
protocol = traxpython
command = vot_wrapper_multiobject
paths = /home/alexx/Projects/VOTSTracker/dam4sam
python = /home/alexx/Projects/VOTSTracker/dam4sam/.venv/bin/python3
timeout = 3600

[dam4sam_l]
