# ── Per-component knock-out ablation (see docs/ABLATION.md) ────────────────
# Results are produced standalone with scripts/run_eval_170.py --tracker ko_*
# --out dam4sam_ko_* ; the entries below exist for `vot pack` and traxpython.

[dam4sam_ko_tie]
label = knock-out: no ambiguity gate (motion blends on every frame)
protocol = traxpython
command = vot_wrapper_knockouts
env_KO_VARIANT = ko_tie
paths = /home/alexx/Projects/VOTSTracker/dam4sam
python = /home/alexx/Projects/VOTSTracker/dam4sam/.venv/bin/python3
timeout = 3600

[dam4sam_ko_speed]
